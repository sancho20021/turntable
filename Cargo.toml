[package]
name = "turntable"
version = "0.1.0"
edition = "2024"

[dependencies]

anyhow = "1"
cpal = "0.17"
symphonium = { version = "0.12", features = ["mp3", "flac", "aac"] }
# symphonia = { version = "0.6", features = ["wav", "isomp4", "mp3", "aac", "flac"] }
atomic_float = "1.1"
sdl2 = { version = "0.38", features = ["bundled"] }
clap = { version = "4.6", features = ["derive"] }
crossbeam = "0.8"
rtrb = "0.3"
log = "0.4"
env_logger = "0.11"
